# Cloud Build config for the push-to-master trigger (see DEPLOY.md). It is the
# config Cloud Run's "deploy from repository" setup generated, plus:
#   - GIT_COMMIT_SHA baked into the image, so /version and the startup logs
#     of the web service and every job name the commit they run;
#   - the worker/sync/pipeline jobs moved to the same image, since the
#     generated config only updated the web service and left the jobs on
#     whatever image they were created with;
#   - a newest-commit check, so overlapping builds never deploy an older
#     commit over a newer one.
# The trigger supplies the _AR_* / _SERVICE_NAME / _DEPLOY_REGION /
# _TRIGGER_ID substitutions; the defaults below match production.
substitutions:
  _AR_HOSTNAME: africa-south1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _SERVICE_NAME: strathmore-study-buddy-git
  _DEPLOY_REGION: africa-south1
  _JOBS: study-buddy-worker study-buddy-sync study-buddy-pipeline
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  requestedVerifyOption: VERIFIED
images:
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
steps:
  - id: Pull
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || exit 0
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - --build-arg=GIT_COMMIT_SHA=$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -f
      - Dockerfile
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME
  # Newest commit wins. Builds of two quick pushes run concurrently and can
  # finish in either order, so an older build must not deploy over a newer
  # one: if the branch has moved past this commit, skip the deploy steps and
  # leave it to the newer build. Fails closed if GitHub can't be reached;
  # retry the build. A newer build that fails leaves the previous deploy up.
  - id: Newest commit?
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        tip=$(git ls-remote "https://github.com/$REPO_FULL_NAME" "refs/heads/$BRANCH_NAME" | cut -f1)
        if [ -z "$$tip" ]; then
          echo "could not read $BRANCH_NAME from $REPO_FULL_NAME" >&2; exit 1
        fi
        if [ "$$tip" != "$COMMIT_SHA" ]; then
          echo "$BRANCH_NAME is at $$tip, not $COMMIT_SHA: skipping deploy"
          touch /workspace/.skip-deploy
        fi
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        [ -e /workspace/.skip-deploy ] && exit 0
        gcloud run services update $_SERVICE_NAME \
          --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
          --region=$_DEPLOY_REGION --quiet
  # After the web service, whose start runs `alembic upgrade head` first; each
  # job runs it too, so the order is not load-bearing. A job execution already
  # running keeps its old image; the next scheduled one uses the new image.
  - id: Update jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        [ -e /workspace/.skip-deploy ] && exit 0
        for job in $_JOBS; do
          gcloud run jobs update "$$job" \
            --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
            --update-labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
            --region=$_DEPLOY_REGION --quiet
        done
