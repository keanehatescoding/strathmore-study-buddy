[project]
name = "starthmore-study-buddy"
version = "0.1.0"
description = "Study assistant pulling course material from Moodle + Classroom, with spaced-repetition quizzes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",  # CIDR entries in FORWARDED_ALLOW_IPS
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",  # migration 0005 reads .env the way pydantic-settings does
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "httpx>=0.28",
    "itsdangerous>=2.0",
    "cryptography>=42",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "pypdf>=4.0",
    "fonttools>=4.0",  # pypdf needs it to decode CFF Type1 fonts (math symbols)
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "olefile>=0.47",  # legacy .ppt/.doc containers; see app/legacy.py
    "youtube-transcript-api>=1.2,<1.3",  # fetch()/list() API; see extract.py
    "tzdata",  # zoneinfo data for TIMEZONE where the OS has none (slim images)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit, so a ruff upgrade that widens the default set doesn't break CI.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt text: rewrapping it would change the prompts
"app/{grade,quiz}.py" = ["E501"]

[tool.alembic]
script_location = "alembic"

[tool.setuptools.packages.find]
include = ["app*"]
